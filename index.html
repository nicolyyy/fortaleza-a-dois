<style id="appcss">
/* Layout: uma coluna estreita, uma tela por vez. Motivo: sol se pondo sobre o mar.
   Cores: --a e --b identificam cada pessoa; --accent marca o que os dois curtem. */
:root {
  --bg: #F1F6F5; --surface: #FFFFFF; --ink: #0C2B3A; --muted: #4A6572; --line: #D3E1E3; --soft: #E6F0F0;
  --a: #0B7580; --b: #6D4AA8; --on-pc: #FFFFFF;
  --accent: #C93F1D; --on-accent: #FFFFFF; --sun: #F2A93B;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08202B; --surface: #0E2E3B; --ink: #E7F2F1; --muted: #9FBAC1; --line: #1F4352; --soft: #12394A;
    --a: #43C6CF; --b: #BBA1EE; --on-pc: #07222B; --accent: #FF8F6B; --on-accent: #2A0F06; --sun: #F2B24A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08202B; --surface: #0E2E3B; --ink: #E7F2F1; --muted: #9FBAC1; --line: #1F4352; --soft: #12394A;
  --a: #43C6CF; --b: #BBA1EE; --on-pc: #07222B; --accent: #FF8F6B; --on-accent: #2A0F06; --sun: #F2B24A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--font-body);
  padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(2.3rem, 9vw, 3.6rem); font-weight: 800; }
h2 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.lead { font-size: 1.1rem; max-width: 52ch; color: var(--ink); }
.muted { color: var(--muted); }
.fine { font-size: .875rem; color: var(--muted); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }

.hero { display: grid; gap: 14px; }
.motif { width: min(100%, 340px); height: auto; display: block; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 16px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row > * { min-width: 0; }

.btn { font: inherit; font-weight: 600; padding: .75rem 1.25rem; min-height: 46px; border-radius: 12px; border: 1.5px solid transparent; cursor: pointer; transition: transform .12s ease; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.small { min-height: 38px; padding: .4rem .9rem; font-size: .9rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.stepper button { font: inherit; font-size: 1.25rem; width: 44px; height: 44px; border: 0; background: var(--soft); color: var(--ink); cursor: pointer; }
.stepper output { min-width: 44px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

.how { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; counter-reset: s; }
.how li { counter-increment: s; display: grid; grid-template-columns: 2rem 1fr; gap: 10px; align-items: start; }
.how li::before { content: counter(s); font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 1.4rem; line-height: 1.2; }

/* quiz */
.p0 { --pc: var(--a); } .p1 { --pc: var(--b); }
.who { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; color: var(--muted); }
.who .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--pc); transition: width .25s ease; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 14px; }
.qtitle { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 5vw, 1.9rem); line-height: 1.15; padding: 0; display: block; text-wrap: balance; }
.opts { display: flex; flex-wrap: wrap; gap: 10px; }
.opt { font: inherit; text-align: left; padding: .7rem 1rem; min-height: 46px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; max-width: 100%; }
.opt[aria-pressed="true"] { background: var(--pc); border-color: var(--pc); color: var(--on-pc); font-weight: 600; }
.text-in { font: inherit; font-size: 1.15rem; width: 100%; padding: .8rem 1rem; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.nav { display: flex; justify-content: space-between; gap: 12px; }

textarea { font: .85rem/1.4 ui-monospace, Menlo, monospace; width: 100%; min-height: 84px; padding: .6rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font-weight: 600; }
details > div { display: grid; gap: 10px; margin-top: 12px; }
.err { color: var(--accent); font-size: .9rem; font-weight: 600; }

/* resultados */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: .2rem .7rem; border-radius: 999px; font-size: .875rem; border: 1px solid var(--line); background: var(--soft); }
.chip.a { border-color: var(--a); } .chip.b { border-color: var(--b); } .chip.both { border-color: var(--accent); }
.sumrow { display: grid; gap: 6px; }
.sumrow .lbl { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.tab { font: inherit; font-weight: 600; padding: .5rem 1rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; min-height: 42px; }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.slot { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: 12px; align-items: start; }
.slotlabel { font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 16px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 8px; min-width: 0; }
.pcard.free { background: transparent; border-style: dashed; color: var(--muted); }
.ptop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.ptop h3 { flex: 1 1 12rem; min-width: 0; overflow-wrap: anywhere; }
.badge { font-size: .75rem; font-weight: 600; padding: .15rem .6rem; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); background: var(--soft); color: var(--ink); }
.badge.both { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.badge.a { background: var(--a); border-color: var(--a); color: var(--on-pc); }
.badge.b { background: var(--b); border-color: var(--b); color: var(--on-pc); }
.meta { font-size: .85rem; color: var(--muted); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.section { display: grid; gap: 12px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.mini { display: grid; gap: 10px; }
.mini .pcard { padding: 12px 14px; }
.note { font-size: .875rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: .6rem 1.1rem; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.code { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 14vw, 4rem); letter-spacing: .18em; text-indent: .18em; line-height: 1; padding: .35em .1em; text-align: center; border: 2px dashed var(--line); border-radius: 16px; background: var(--soft); }
.stat { display: flex; align-items: center; gap: 10px; }
.stat .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.stat.on .dot { background: var(--accent); }
@media print {
  body { background: #fff; color: #000; padding: 0; }
  .no-print, #toast { display: none !important; }
  .pcard { break-inside: avoid; }
  a.btn::after { content: " (" attr(href) ")"; font-size: .7rem; word-break: break-all; }
}
@media (max-width: 520px) {
  .slot { grid-template-columns: 1fr; gap: 6px; }
  .slotlabel { padding-top: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const KEY = 'fortaleza-a-dois-v1';

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

}
function sumDays(days) {

}
function totalCostTxt() {

function stepValid(st, p) {
  if (st.id === 'name') return p.name.trim().length > 0;
  const v = p[st.id];
  return st.type === 'single' ? v !== null && v !== '' : v.length > 0;
}
const complete = p => STEPS.every(st => stepValid(st, p));

function save() { try { localStorage.setItem(KEY, JSON.stringify({ people: S.people, days: S.days, seed: S.seed })); } catch (e) {} }
function loadSaved() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && Array.isArray(r.people) && r.people.length === 2) {
      const ppl = r.people.map(o => sanitize(o));
      if (ppl.every(Boolean)) return { people: ppl, days: Math.min(5, Math.max(1, +r.days || 3)), seed: +r.seed || 0 };
    }
  } catch (e) {}
  return null;
}
function sanitize(o) {
  if (!o || typeof o !== 'object') return null;
  const p = blank();
  p.name = String(o.name || '').slice(0, 40).trim();
  for (const q of Q) {
    const ok = q.opts.map(x => x[0]);
    if (q.type === 'single') p[q.id] = ok.includes(o[q.id]) ? o[q.id] : null;
    else p[q.id] = Array.isArray(o[q.id]) ? o[q.id].filter(v => ok.includes(v)) : [];
  }
  return complete(p) ? p : null;
}
const encode = p => 'FDD1:' + btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(p))));
function decode(s) {
  try {
    s = String(s).trim();
    if (!s.startsWith('FDD1:')) return null;
    const bytes = Uint8Array.from(atob(s.slice(5)), c => c.charCodeAt(0));
    return sanitize(JSON.parse(new TextDecoder().decode(bytes)));
  } catch (e) { return null; }
}

/* ---------- Motor de combinação ---------- */
function derive(p) {
  return {
    name: p.name.trim(), pace: { calmo: 0, medio: 1, agito: 2 }[p.pace],
    tags: new Set([...p.interests, ...p.food, ...p.mood]), time: p.time, budget: +p.budget,
    avoid: p.avoid.filter(a => a !== 'nada')
  };
}
function pscore(P, pl) {
  let m = 0; for (const t of pl.t) if (P.tags.has(t)) m++;
  let s = Math.min(1, m / 2);
  if (pl.f.some(f => P.avoid.includes(f))) s -= 0.45;
  if (pl.c > P.budget) s -= 0.2 * (pl.c - P.budget);
  return Math.max(0, s);
}
function pair(pl) {
  const a = pscore(D[0], pl), b = pscore(D[1], pl);
  return { a, b, score: 0.6 * Math.min(a, b) + 0.4 * (a + b) / 2 };
}
const slotBonus = slot => ['manha', 'tarde', 'noite'].includes(slot) ? D.reduce((n, d) => n + (d.time.includes(slot) ? 0.05 : 0), 0) : 0;
function zdist(a, b) { if (a === b) return 0; return Math.abs(ZPOS[a] - ZPOS[b]) <= 1 ? 1 : 2; }
function jitter(id) {
  if (!S.seed) return 0;
  let h = (S.seed * 2654435761) >>> 0;
  for (let i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 16777619) >>> 0;
  return (h % 1000) / 1000 * 0.14;
}
function candidates(slot, used) {
  const kind = ['manha', 'tarde', 'noite'].includes(slot) ? 'v' : 'c';
  return PLACES.filter(p => p.k === kind && p.s.includes(slot) && !used.has(p.id));
}
function rankFor(slot, ctx, used) {
  return candidates(slot, used).map(p => {
    let sc = pair(p).score + slotBonus(slot) + jitter(p.id);
    if (ctx.zone && p.z !== '*') sc += [0.25, 0.1, 0][zdist(ctx.zone, p.z)];
    sc -= 0.06 * p.t.filter(t => ctx.tags[t]).length;
    return { p, sc };
  }).sort((x, y) => y.sc - x.sc);
}
function generate() {
  const used = new Set(), days = [];
  const pace = Math.round((D[0].pace + D[1].pace) / 2);
  const wantLanche = D.some(d => d.tags.has('doce'));
  const noFar = D.some(d => d.avoid.includes('longe'));
  const trips = {};
  if (S.days >= 2 && !noFar) {
    const max = S.days >= 4 ? 2 : 1;
    PLACES.filter(p => p.s[0] === 'dia').map(p => ({ p, sc: pair(p).score + jitter(p.id) }))
      .filter(x => x.sc >= 0.3).sort((x, y) => y.sc - x.sc).slice(0, max)
      .forEach((x, i) => { trips[[1, 3][i]] = x.p; });
  }
  for (let d = 0; d < S.days; d++) {
    const items = [], ctx = { zone: null, tags: {} }, today = new Set();
    let slots;
    if (trips[d]) {
      used.add(trips[d].id); items.push({ slot: 'dia', place: trips[d] }); slots = ['jantar'];
    } else {
      slots = pace === 0 ? ['manha', 'almoco', 'jantar'] : pace === 1 ? ['manha', 'almoco', 'tarde', 'jantar'] : ['manha', 'almoco', 'tarde', 'jantar', 'noite'];
      if (wantLanche) slots.splice(slots.includes('tarde') ? slots.indexOf('tarde') + 1 : slots.indexOf('almoco') + 1, 0, 'lanche');
    }
    for (const slot of slots) {
      let r = rankFor(slot, ctx, used);
      if (!r.length) r = rankFor(slot, ctx, today);
      if (!r.length) { items.push({ slot, place: null }); continue; }
      const pl = r[0].p;
      used.add(pl.id); today.add(pl.id);
      if (pl.z !== '*') ctx.zone = pl.z;
      pl.t.forEach(t => { ctx.tags[t] = 1; });
      items.push({ slot, place: pl });
    }
    days.push({ items, pace });
  }
  S.plan = { days };
  if (S.day >= days.length) S.day = 0;
  syncPlan();
}
const usedIds = () => new Set(S.plan.days.flatMap(d => d.items.filter(i => i.place).map(i => i.place.id)));

function why(p) {
  const ca = p.t.filter(t => D[0].tags.has(t)), cb = p.t.filter(t => D[1].tags.has(t));
  const both = ca.filter(t => cb.includes(t));
  const n0 = esc(D[0].name), n1 = esc(D[1].name);
  if (both.length) return { kind: 'both', badge: 'Os dois curtem', text: 'Os dois gostam de ' + list(both.map(L)) + '.' };
  if (ca.length && cb.length) return { kind: 'mix', badge: 'Um de cada', text: n0 + ' curte ' + list(ca.map(L)) + ', e ' + n1 + ' curte ' + list(cb.map(L)) + '.' };
  if (ca.length) return { kind: 'a', badge: 'Para ' + n0, text: 'Combina com ' + list(ca.map(L)) + ', que ' + n0 + ' escolheu.' };
  if (cb.length) return { kind: 'b', badge: 'Para ' + n1, text: 'Combina com ' + list(cb.map(L)) + ', que ' + n1 + ' escolheu.' };
  return { kind: 'none', badge: 'Para conhecer', text: 'Uma boa pedida para conhecer a cidade.' };
}
function dayTitle(day) {
  const zs = [...new Set(day.items.filter(i => i.place && i.place.k === 'v' && i.place.z !== '*').map(i => i.place.z))];
  const base = zs.length ? list(zs.slice(0, 2).map(z => ZONENAME[z])) : 'Dia livre';
  const extra = day.pace === 0 && !day.items.some(i => i.slot === 'dia') ? ' · tarde livre para descansar' : '';
  return base + extra;
}

function buildShareHtml() {
  const css = document.getElementById('appcss').textContent;
  const days = S.plan.days.map((d, i) => `<section class="section"><div><h2>Dia ${i + 1}</h2><p class="muted">${esc(dayTitle(d))}</p><p class="fine">${dayCostTxt(d)}</p></div><ol class="timeline">${d.items.map((it, ii) => itemHtml(it, i, ii, true)).join('')}</ol></section>`).join('');
  const date = new Date().toLocaleDateString('pt-BR');
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roteiro em Fortaleza: ${esc(D[0].name)} e ${esc(D[1].name)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"><style>${css}</style></head><body><main class="wrap">
  <section class="hero"><p class="eyebrow">Fortaleza, Ceará · ${date}</p><h1>${esc(D[0].name)} e ${esc(D[1].name)} em Fortaleza</h1></section>
  ${summaryHtml()}${days}
  <p class="note">Horários, preços e funcionamento mudam. Confirme antes de ir, principalmente em feriados e fins de semana. Os links abrem cada lugar no Google Maps. Os valores são estimativas aproximadas, por pessoa, e podem variar bastante.</p>
  <div class="row no-print"><button class="btn ghost" onclick="window.print()">Imprimir ou salvar em PDF</button></div>
</main></body></html>`;
}
function viewResults() {
  const [a, b] = D;
  const common = [...a.tags].filter(t => b.tags.has(t));
  const onlyA = [...a.tags].filter(t => !b.tags.has(t)), onlyB = [...b.tags].filter(t => !a.tags.has(t));
  const chips = (arr, cls) => arr.length ? `<div class="chips">${arr.map(t => `<span class="chip ${cls}">${L(t)}</span>`).join('')}</div>` : '';
  const day = S.plan.days[S.day];
  const used = usedIds();
  const others = PLACES.filter(p => !used.has(p.id));
  const mimo = i => others.filter(p => pscore(D[i], p) >= 0.5 && pscore(D[1 - i], p) < 0.3).sort((x, y) => pscore(D[i], y) - pscore(D[i], x)).slice(0, 3);
  const more = others.filter(p => S.filter === 'all' || p.k === S.filter).map(p => ({ p, s: pair(p).score })).sort((x, y) => y.s - x.s).slice(0, 8).map(x => x.p);
  const mm = [0, 1].map(mimo);
  return `<section class="hero">
    <p class="eyebrow">Roteiro pronto</p>
    <h1 tabindex="-1" data-focus>${esc(a.name)} e ${esc(b.name)} em Fortaleza</h1>
  </section>
  ${summaryHtml()}
  <section class="section">
    <div class="row">
      ${RO() ? `<p class="fine">${esc(D[0].name)} criou a sala e controla os dias e as trocas. O que mudar aparece aqui na hora.</p>` : `<div class="stepper"><button aria-label="Menos um dia" data-act="rdays" data-d="-1">−</button><output aria-live="polite">${S.days} ${S.days === 1 ? 'dia' : 'dias'}</output><button aria-label="Mais um dia" data-act="rdays" data-d="1">+</button></div>`}
      <div class="seg"><button class="btn primary small" data-act="saveFile">Salvar roteiro</button><button class="btn ghost small" data-act="copyPlan">Copiar com links</button>${RO() ? '' : '<button class="btn ghost small" data-act="shuffle">Variar sugestões</button>'}</div>
    </div>
    <p class="fine">Salvar roteiro gera um arquivo com este mesmo visual e os links do mapa. Ele abre em qualquer celular ou computador, dá para enviar por WhatsApp ou e-mail e, de lá, imprimir ou salvar em PDF.</p>
    <div id="copybox" hidden><p class="fine">Seu navegador não deixou copiar sozinho. Selecione o texto abaixo e copie.</p><textarea id="fallbackBox" readonly></textarea></div>
    <div class="tabs" role="tablist" aria-label="Dias do roteiro">${S.plan.days.map((_, i) => `<button class="tab" role="tab" aria-selected="${i === S.day}" data-act="day" data-i="${i}">Dia ${i + 1}</button>`).join('')}</div>
    <div class="section" role="tabpanel">
      <div><h2>Dia ${S.day + 1}</h2><p class="muted">${esc(dayTitle(day))}</p><p class="fine">${dayCostTxt(day)}</p></div>
      <ol class="timeline">${day.items.map((it, ii) => itemHtml(it, S.day, ii)).join('')}</ol>
    </div>
  </section>
  ${mm[0].length || mm[1].length ? `<section class="section"><h2>Um mimo para cada um</h2><p class="muted">Ficaram de fora do roteiro porque agradam mais a um do que ao outro. Que tal encaixar um por viagem?</p>
    ${[0, 1].map(i => mm[i].length ? `<div class="mini"><span class="chip ${i ? 'b' : 'a'}" style="justify-self:start">Para ${esc(D[i].name)}</span>${mm[i].map(miniHtml).join('')}</div>` : '').join('')}</section>` : ''}
  <section class="section"><h2>Mais ideias</h2>
    <div class="seg">${[['all', 'Tudo'], ['v', 'Visitar'], ['c', 'Comer']].map(([v, l]) => `<button class="tab" aria-pressed="${S.filter === v}" data-act="filter" data-v="${v}" ${S.filter === v ? 'style="background:var(--ink);border-color:var(--ink);color:var(--bg)"' : ''}>${l}</button>`).join('')}</div>
    <div class="mini">${more.map(miniHtml).join('') || '<p class="muted">Todas as ideias já entraram no roteiro.</p>'}</div>
  </section>
  <p class="note">Horários, preços e funcionamento mudam. Confirme antes de ir, principalmente em feriados e fins de semana. Os valores são estimativas aproximadas e podem variar bastante conforme a época, o pedido e o local.</p>
  <div class="row"><button class="btn ghost" data-act="restart">Começar de novo</button></div>`;
}

function render(top = true) {
  const v = { intro: viewIntro, quiz: viewQuiz, handoff: viewHandoff, results: viewResults, remoteChoose: viewRemoteChoose, room: viewRoom }[S.screen];
  $app.innerHTML = v();
  if (top) { window.scrollTo(0, 0); const f = $app.querySelector('[data-focus]'); if (f && S.screen !== 'intro') f.focus({ preventScroll: true }); }
}

/* ---------- Ações ---------- */
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800);
}
async function copyText(text, onFail) {
  try { await navigator.clipboard.writeText(text); toast('Copiado'); }
  catch (e) { onFail && onFail(); }
}
function planText() {
  const out = ['Roteiro em Fortaleza: ' + D[0].name + ' e ' + D[1].name, totalCostTxt(), ''];
  S.plan.days.forEach((d, i) => {
    out.push('Dia ' + (i + 1) + ' (' + dayTitle(d) + ')'); out.push(dayCostTxt(d));
    d.items.forEach(it => { out.push('- ' + SLOTLABEL[it.slot] + ': ' + (it.place ? it.place.n + ' (' + it.place.b + ')' : 'livre')); if (it.place) out.push('  ' + mapUrl(it.place)); });
    out.push('');
  });
  return out.join('\n').trim();
}
function finish() {
  D = S.people.map(derive); S.seed = 0; S.day = 0; S.filter = 'all'; generate(); save(); S.screen = 'results'; render();
}
function validNow() { return stepValid(STEPS[S.step], S.people[S.cur]); }

const act = {
  days(el) { S.days = Math.min(5, Math.max(1, S.days + +el.dataset.d)); render(false); },
  start() { S.people = [blank(), blank()]; S.cur = 0; S.step = 0; S.screen = 'quiz'; render(); },
  loadSaved() { const r = loadSaved(); if (!r) return; S.people = r.people; S.days = r.days; S.seed = r.seed; D = S.people.map(derive); S.day = 0; S.filter = 'all'; generate(); S.screen = 'results'; render(); },
  opt(el) {
    const st = STEPS[S.step], p = S.people[S.cur], v = el.dataset.v;
    if (st.type === 'single') p[st.id] = v;
    else {
      const arr = p[st.id], i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1);
      else {
        if (v === 'nada') arr.length = 0;
        else if (arr.includes('nada')) arr.splice(arr.indexOf('nada'), 1);
        arr.push(v);
      }
    }
    render(false);
  },
  next() {
    if (!validNow()) return;
    if (S.step < STEPS.length - 1) { S.step++; render(); return; }
    if (S.remote) { remoteDone(); return; }
    if (S.cur === 0) { S.screen = 'handoff'; render(); } else finish();
  },
  back() {
    if (S.screen === 'handoff') { S.screen = 'quiz'; S.cur = 0; S.step = STEPS.length - 1; render(); return; }
    if (S.step > 0) { S.step--; render(); return; }
    if (S.remote) { S.screen = 'room'; render(); return; }
    if (S.cur === 1) { S.screen = 'handoff'; render(); return; }
    S.screen = 'intro'; render();
  },
  startSecond() { S.cur = 1; S.step = 0; S.screen = 'quiz'; render(); },
  remoteStart() { S.screen = 'remoteChoose'; render(); },
  toIntro() { S.screen = 'intro'; render(); },
  roomCreate() { enterRoom(String(Math.floor(1000 + Math.random() * 9000)), 'host'); },
  roomJoin() {
    const v = (document.getElementById('roomCode').value || '').replace(/\D/g, '');
    if (v.length !== 4) { const e = document.getElementById('roomErr'); if (e) e.textContent = 'Digite os 4 números do código.'; return; }
    enterRoom(v, 'guest');
  },
  remoteQuiz() {
    S.cur = 0; S.step = 0; S.screen = 'quiz';
    if (ROOM) ROOM.presence({ status: 'respondendo' }).catch(() => {});
    render();
  },
  exitRoom() { leaveRoom(); S.screen = 'intro'; render(); },
  copyCode() { const t = document.getElementById('myCode'); copyText(t.value, () => { t.select(); toast('Selecione e copie'); }); },
  useCode() {
    const p = decode(document.getElementById('otherCode').value);
    if (!p) { document.getElementById('codeErr').textContent = 'Esse código não é válido. Confira se foi copiado inteiro, começando com FDD1:'; return; }
    S.people[1] = p; finish();
  },
  rdays(el) { S.days = Math.min(5, Math.max(1, S.days + +el.dataset.d)); generate(); save(); render(false); },
  shuffle() { S.seed = (S.seed || 0) + 1; generate(); save(); render(false); toast('Sugestões atualizadas'); },
  day(el) { S.day = +el.dataset.i; render(false); },
  filter(el) { S.filter = el.dataset.v; render(false); },
  swap(el) {
    const di = +el.dataset.day, ii = +el.dataset.i, it = S.plan.days[di].items[ii];
    if (!it || !it.place) return;
    const used = usedIds(); used.delete(it.place.id);
    const opts = candidates(it.slot, used).sort((x, y) => (pair(y).score + slotBonus(it.slot)) - (pair(x).score + slotBonus(it.slot)));
    if (opts.length < 2) { toast('Não há outra sugestão para este horário'); return; }
    const idx = opts.findIndex(x => x.id === it.place.id);
    it.place = opts[(idx + 1) % opts.length];
    syncPlan();
    render(false);
  },
  async saveFile() {
    try {
      const dl = window.claude && await window.claude.use('downloads');
      if (!dl) { toast('Salvar arquivo não está disponível aqui. Use Copiar com links.'); return; }
      await dl.save({ filename: 'roteiro-fortaleza.html', data: buildShareHtml() });
      toast('Roteiro salvo');
    } catch (e) {
      if (e && e.code === 'declined') return;
      toast('Não foi possível salvar. Use Copiar com links.');
    }
  },
  copyPlan() {
    const text = planText();
    copyText(text, () => { const box = document.getElementById('copybox'); box.hidden = false; const ta = document.getElementById('fallbackBox'); ta.value = text; ta.focus(); ta.select(); });
  },
  restart() { leaveRoom(); S.screen = 'intro'; S.people = [blank(), blank()]; S.cur = 0; S.step = 0; render(); }
};

/* ---------- Cada um no seu celular (sala) ---------- */
let ROOM = null, offPeers = null;
const RO = () => !!(S.remote && S.remote.role === 'guest');
function otherPeer() {
  if (!ROOM || !S.remote) return null;
  return ROOM.peers().find(p => !p.sameTab && p.presence && p.presence.app === 'fdd' && p.presence.role !== S.remote.role) || null;
}
function serializePlan() { return S.plan.days.map(d => ({ p: d.pace, i: d.items.map(it => [it.slot, it.place ? it.place.id : '']) })); }
function syncPlan() {
  if (!ROOM || !S.remote || S.remote.role !== 'host' || !S.remote.done || !S.plan) return;
  ROOM.presence({ plan: serializePlan(), days: S.days }).catch(() => {});
}
function applyPlan(pr) {
  const days = pr.plan.map(d => ({ pace: d.p, items: d.i.map(([slot, id]) => ({ slot, place: PLACES.find(p => p.id === id) || null })) }));
  S.plan = { days }; S.days = days.length; if (S.day >= days.length) S.day = 0;
}
function leaveRoom() {
  try { offPeers && offPeers(); ROOM && ROOM.leave(); } catch (e) {}
  ROOM = null; offPeers = null; S.remote = null;
}
function tryComplete() {
  const R = S.remote;
  if (!R || !R.done || S.screen !== 'room') return;
  const o = otherPeer();
  if (!o || o.presence.status !== 'pronto') return;
  const theirs = sanitize(o.presence.answers);
  if (!theirs) return;
  const mine = S.people[0];
  if (R.role === 'guest' && !Array.isArray(o.presence.plan)) return;
  S.people = R.role === 'host' ? [mine, theirs] : [theirs, mine];
  D = S.people.map(derive); S.day = 0; S.filter = 'all';
  if (R.role === 'host') { S.seed = 0; generate(); }
  else { try { applyPlan(o.presence); S.lastPlan = JSON.stringify(o.presence.plan); } catch (e) { return; } }
  save(); S.screen = 'results'; render();
}
function onPeers() {
  if (!S.remote) return;
  const o = otherPeer();
  if (RO() && S.screen === 'results' && o && Array.isArray(o.presence.plan)) {
    const s = JSON.stringify(o.presence.plan);
    if (s !== S.lastPlan) { S.lastPlan = s; try { applyPlan(o.presence); render(false); } catch (e) {} }
  }
  tryComplete();
  if (S.screen === 'room') render(false);
}
async function remoteDone() {
  const me = S.people[0];
  S.remote.done = true; S.screen = 'room'; render();
  try { await ROOM.presence({ status: 'pronto', name: me.name.trim(), answers: me }); }
  catch (e) { if (S.remote) S.remote.done = false; toast('Não consegui enviar suas respostas. Tente de novo.'); render(false); return; }
  tryComplete();
}
async function enterRoom(code, role) {
  const err = m => { const e = document.getElementById('roomErr'); if (e) e.textContent = m; };
  err('Conectando…');
  leaveRoom();
  let r = null;
  try { r = window.claude && await window.claude.use('room'); } catch (e) {}
  if (!r) { err('Este modo só funciona quando a página é aberta pelo link do Claude, com o login feito. Use "Nós dois, neste celular".'); return; }
  try {
    const room = await r.join('sala-' + code);
    ROOM = room; S.remote = { code, role, done: false }; S.people = [blank(), blank()]; S.cur = 0; S.step = 0; S.plan = null; S.lastPlan = '';
    offPeers = room.onPeers(onPeers, () => toast('A conexão com a sala caiu. Volte ao início e entre de novo.'));
    await room.presence({ app: 'fdd', role, status: 'entrou' });
    S.screen = 'room'; render();
  } catch (e) {
    leaveRoom();
    err('Não consegui entrar na sala. Confira o código e a internet e tente de novo.');
  }
}
function viewRemoteChoose() {
  return `<section class="card">
    <h2 tabindex="-1" data-focus>Cada um no seu celular</h2>
    <p>Os dois abrem este mesmo link e deixam a página aberta até o roteiro aparecer. Uma pessoa cria a sala e a outra entra com o código.</p>
    <button class="btn primary" data-act="roomCreate">Criar uma sala</button>
    <p class="fine">Você recebe um código de 4 números para passar ao seu par.</p>
    <div style="display:grid;gap:8px;border-top:1px solid var(--line);padding-top:16px">
      <label for="roomCode"><strong>Já recebeu um código?</strong></label>
      <input class="text-in" id="roomCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000">
      <button class="btn ghost" data-act="roomJoin">Entrar na sala</button>
    </div>
    <p class="err" id="roomErr" role="alert"></p>
    <button class="btn ghost" data-act="toIntro">Voltar</button>
  </section>`;
}
function viewRoom() {
  const R = S.remote, o = otherPeer(), st = o && o.presence.status;
  const oName = o && o.presence.name ? esc(String(o.presence.name).slice(0, 40)) : 'A outra pessoa';
  const partner = !o ? 'A outra pessoa ainda não entrou na sala' : st === 'pronto' ? oName + ' já respondeu' : st === 'respondendo' ? oName + ' está respondendo' : oName + ' entrou na sala';
  return `<section class="card p0">
    <p class="eyebrow">Código da sala</p>
    <div class="code" tabindex="-1" data-focus>${esc(R.code)}</div>
    ${R.role === 'host' ? '<p>Passe este código para o seu par. A outra pessoa abre este mesmo link, toca em "Cada um no seu celular" e digita os 4 números em "Entrar na sala".</p>' : '<p>Você entrou na sala. Se o seu par não aparecer, confira se o código está certo.</p>'}
    <div class="stat ${o ? 'on' : ''}"><span class="dot"></span><span>${partner}</span></div>
    <div class="stat ${R.done ? 'on' : ''}"><span class="dot"></span><span>${R.done ? 'Suas respostas foram enviadas' : 'Você ainda não respondeu'}</span></div>
    ${R.done ? '<p class="fine">Deixe esta página aberta. O roteiro aparece sozinho aqui e no outro celular quando os dois terminarem.</p>' : '<button class="btn primary" data-act="remoteQuiz">Responder minhas perguntas</button>'}
    <button class="btn ghost" data-act="exitRoom">Sair da sala</button>
  </section>`;
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'roomCode') act.roomJoin(); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && act[el.dataset.act]) act[el.dataset.act](el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'nameInput') {
    S.people[S.cur].name = e.target.value;
    const n = document.getElementById('nextBtn'); if (n) n.disabled = !validNow();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'nameInput' && validNow()) { e.preventDefault(); act.next(); }
});

render(false);
</script>

</body></html>
